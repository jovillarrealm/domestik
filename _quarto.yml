project:
  type: website

website:
  description: "Química doméstica explicada con intuición, límites y evidencia."
  site-url: https://jovillarrealm.github.io/domestik # you must change this appropriately for RSS feeds to work properly
  title: "domestik"
  navbar:
    right:
      - icon: github
        href: https://github.com/jovillarrealm/domestik

format:
  html:
    respect-user-color-scheme: true
    toc: true
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    css: styles.css
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px



